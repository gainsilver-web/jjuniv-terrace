<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>제이제이 런</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* layout: full-bleed canvas stage; HUD pinned to the top edge; menus are one paper sheet centered over the dusk scene */
:root{
  --dusk-top:#272a6e; --dusk-low:#ff9a6c;
  --ink:#1a1740; --ink-soft:#4b4777;
  --paper:#fff5e4; --paper-dim:#f1e3cb;
  --coin:#ffd23f; --go:#ff6f59; --go-deep:#d94f3b;
  --jj:#3f6df2; --byeol:#ffcf33; --jtro:#2ec4b6;
  --font-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--font-body);overflow:hidden}
#stage{position:relative;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

#hud{position:absolute;inset:0 0 auto 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.pill{background:color-mix(in srgb,var(--ink) 72%,transparent);color:var(--paper);border-radius:999px;
  padding:6px 14px;font-family:var(--font-display);font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.2}
.pill small{font-size:.8rem;opacity:.8;margin-left:2px}
.pill.coin::before{content:"";display:inline-block;width:.8em;height:.8em;border-radius:50%;background:var(--coin);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 35%,var(--coin));margin-right:6px;vertical-align:-.05em}
#chip{font-size:.95rem}
.spacer{flex:1}
.icon-btn{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
  background:color-mix(in srgb,var(--ink) 72%,transparent);color:var(--paper);font-family:var(--font-display);font-size:1rem}
.icon-btn:focus-visible,.btn:focus-visible,.char:focus-visible{outline:3px solid var(--coin);outline-offset:2px}

#toast{position:absolute;left:0;right:0;top:22%;text-align:center;font-family:var(--font-display);font-size:clamp(1.6rem,6vw,2.6rem);
  color:var(--coin);text-shadow:0 3px 0 var(--ink);pointer-events:none;opacity:0}
#toast.show{animation:pop 1.4s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}

.wrap{position:absolute;inset:0;display:grid;place-items:center;overflow-y:auto;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--ink) 55%,transparent)}
.sheet{width:100%;max-width:540px;background:var(--paper);color:var(--ink);border-radius:28px;
  padding:24px 20px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 0 color-mix(in srgb,var(--ink) 60%,transparent)}
h1,h2{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(2.4rem,10vw,3.4rem);color:var(--go)}
h1 span{color:var(--ink)}
h2{font-size:2rem}
.lede{margin:0;color:var(--ink-soft);font-size:1rem;line-height:1.5}
.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.char{min-width:0;background:var(--paper-dim);border:3px solid transparent;border-radius:20px;padding:8px 4px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font-family:var(--font-body)}
.char canvas{width:95px;height:96px;max-width:100%}
.char b{font-family:var(--font-display);font-weight:400;font-size:1.2rem}
.char i{font-style:normal;font-size:.8rem;color:var(--ink-soft)}
.char[aria-pressed="true"]{border-color:var(--ink);background:#fff}
#desc{margin:0;min-height:3em;font-size:.95rem;line-height:1.5;color:var(--ink)}
.btn{font-family:var(--font-display);font-size:1.4rem;border:0;border-radius:18px;padding:14px 18px;cursor:pointer;
  background:var(--go);color:#fff;box-shadow:0 5px 0 var(--go-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--go-deep)}
.btn.ghost{background:var(--paper-dim);color:var(--ink);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 25%,var(--paper-dim))}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 180px}
.keys{margin:0;font-size:.85rem;color:var(--ink-soft);line-height:1.6}
.keys kbd{font-family:var(--font-body);font-weight:600;background:var(--paper-dim);border-radius:6px;padding:1px 6px;color:var(--ink)}
.nick{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.1rem}
.nick input{flex:1;min-width:0;font:inherit;font-family:var(--font-body);font-size:1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--ink-soft);background:#fff;color:var(--ink)}
.nick input:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:8px;align-items:baseline;background:var(--paper-dim);border-radius:12px;padding:8px 12px}
.rank li.me{background:#fff;box-shadow:inset 0 0 0 3px var(--ink)}
.rank .no{font-family:var(--font-display);font-size:1.2rem;color:var(--go)}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rank .nm small{font-weight:400;color:var(--ink-soft);margin-left:6px}
.rank .sc{font-family:var(--font-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.big{font-family:var(--font-display);font-size:clamp(3rem,14vw,4.4rem);line-height:1;color:var(--go);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.stats div{background:var(--paper-dim);border-radius:14px;padding:8px 10px}
.stats dt{font-size:.78rem;color:var(--ink-soft)}
.stats dd{margin:0;font-family:var(--font-display);font-size:1.25rem;font-variant-numeric:tabular-nums}
</style>

<div id="stage">
  <canvas id="cv" aria-label="달리기 게임 화면"></canvas>

  <div id="hud" hidden>
    <span class="pill"><span id="hDist">0</span><small>m</small></span>
    <span class="pill coin"><span id="hCoin">0</span></span>
    <span class="pill" id="chip"></span>
    <span class="spacer"></span>
    <button class="icon-btn" id="btnMute" type="button" aria-label="소리 끄기">♪</button>
    <button class="icon-btn" id="btnPause" type="button" aria-label="일시정지">Ⅱ</button>
  </div>
  <div id="toast" aria-live="polite"></div>

  <div class="wrap" id="menu">
    <div class="sheet">
      <h1>제이제이 <span>런</span></h1>
      <p class="lede">장애물을 피하고 코인을 모으면서 최대한 멀리 달려요. 누구랑 뛸래요?</p>
      <div class="chars" id="chars"></div>
      <p id="desc"></p>
      <label class="nick" for="nick" id="nickRow">닉네임 <input id="nick" type="text" maxlength="10" placeholder="랭킹에 올릴 이름 (10자까지)" autocomplete="off"></label>
      <div class="row">
        <button class="btn" id="btnStart" type="button">달리기 시작</button>
        <button class="btn ghost" id="btnRank" type="button">랭킹 보기</button>
      </div>
      <p class="keys"><kbd>←</kbd> <kbd>→</kbd> 옆으로 · <kbd>↑</kbd>/<kbd>Space</kbd> 점프 · <kbd>↓</kbd> 슬라이드 · <kbd>P</kbd> 일시정지<br>폰에서는 화면을 밀어요. 톡 누르면 점프!</p>
    </div>
  </div>

  <div class="wrap" id="pause" hidden>
    <div class="sheet">
      <h2>잠깐 쉬는 중</h2>
      <p class="lede">숨 고르고 다시 가요.</p>
      <div class="row">
        <button class="btn" id="btnResume" type="button">계속 달리기</button>
        <button class="btn ghost" id="btnQuit" type="button">처음으로</button>
      </div>
    </div>
  </div>

  <div class="wrap" id="over" hidden>
    <div class="sheet">
      <h2 id="oTitle">앗, 부딪혔다!</h2>
      <div class="big" id="oScore">0</div>
      <dl class="stats">
        <div><dt>거리</dt><dd id="oDist">0 m</dd></div>
        <div><dt>코인</dt><dd id="oCoin">0</dd></div>
        <div><dt>최고 점수</dt><dd id="oBest">0</dd></div>
      </dl>
      <p class="lede" id="oQuip"></p>
      <p class="lede" id="oRank" hidden></p>
      <div class="row">
        <button class="btn" id="btnRetry" type="button">다시 달리기</button>
        <button class="btn ghost" id="btnChange" type="button">캐릭터 바꾸기</button>
        <button class="btn ghost" id="btnRank2" type="button">랭킹 보기</button>
      </div>
    </div>
  </div>

  <div class="wrap" id="rank" hidden>
    <div class="sheet">
      <h2>랭킹 TOP 10</h2>
      <ol class="rank" id="rankList"></ol>
      <p class="lede" id="rankMsg"></p>
      <button class="btn ghost" id="btnRankClose" type="button">닫기</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 설정 ---------- */
const ZP = 6, LANE = 1.5, ROAD = 2.45, ZFAR = 95, GRAV = 36, JUMP = 11.5, CH = 96, TILE = 4.9;
const CHARS = {
  jj:    { name:'제이제이', tag:'코인 자석', desc:'옆 줄 코인까지 알아서 딸려와요. 코인 부자 되기 딱 좋은 친구.' },
  byeol: { name:'별이',     tag:'2단 점프', desc:'공중에서 한 번 더 뛸 수 있어요. 타이밍 살짝 놓쳐도 살아남는 친구.' },
  jtro:  { name:'제이트', tag:'방패',     desc:'한 판에 딱 한 번, 부딪혀도 버텨요. 다시 충전은 없으니 아껴 쓰기!' }
};
const ORDER = ['jj','byeol','jtro'], DIM = { jj: 1.75, byeol: 1.6, jtro: 1.8 };
const SP = window.JJ_SPRITES;

let W = 1, H = 1, state = 'menu', sel = 'jj', best = 0, T = 0, last = 0, overShown = false, frameId = 0;
let g;
try { best = +localStorage.getItem('jjrun.best') || 0; const s = localStorage.getItem('jjrun.char'); if (CHARS[s]) sel = s; } catch (e) {}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- 소리 ---------- */
let ac = null, muted = false;
function beep(freq, dur, type, vol, slide) {
  if (muted || !ac) return;
  try {
    const t = ac.currentTime, o = ac.createOscillator(), ga = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    ga.gain.setValueAtTime(vol || 0.05, t); ga.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(ga); ga.connect(ac.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}

/* ---------- 한 판 ---------- */
function newRun() {
  const keep = g ? g.dist : 0;
  g = { t:0, dist:0, scroll:keep, speed:16, coins:0, objs:[], spawnAt:0, lane:0, x:0, y:0, vy:0, jumps:0, slide:0, wantSlide:false,
        shield: sel === 'jtro' ? 1 : 0, shieldCoins:0, inv:0, phase:0, shake:0, dead:0, nextMile:500 };
}
const TJ = 2 * JUMP / GRAV;   // 점프 한 번의 체공 시간(초)
const gap = () => g.speed * (TJ + 0.36 - 0.08 * clamp((g.speed - 16) / 24, 0, 1));   // 점프 + 반응 여유를 항상 보장
function addArc(lane, z) {      // 그 속도의 실제 점프 궤적 위에 코인을 놓는다
  const v = Math.min(40, g.speed + 1.2), n = clamp(Math.round(v * TJ / 2.2), 5, 9);
  for (let i = 0; i < n; i++) { const t = TJ * (0.12 + 0.76 * i / (n - 1)); g.objs.push({ k:'coin', x: lane * LANE, z: z + v * (t - TJ / 2), y: 0.7 + JUMP * t - GRAV * t * t / 2, ph: Math.random() * 6 }); }
}
function addCoins(lane, z, n) {
  for (let i = 0; i < n; i++) {
    g.objs.push({ k:'coin', x: lane * LANE, z: z + i * 1.7, y: 0.7, ph: Math.random() * 6 });
  }
}
function addObs(k, lane, z) { g.objs.push({ k, x: lane * LANE, z, depth: k === 'full' ? 1.6 : 0.3, c: Math.floor(Math.random() * 3) }); }
function spawnRow(z) {
  const L = [-1, 0, 1], r = Math.random(), hard = clamp((g.speed - 16) / 20, 0, 1);
  if (r < 0.2) { addCoins(pick(L), z, 6); }
  else if (r < 0.44) {
    const a = pick(L), k = pick(['low','high','full']); addObs(k, a, z); if (k === 'low') addArc(a, z);
    if (Math.random() < 0.6) addCoins(pick(L.filter(l => l !== a)), z - 2, 4);
  } else if (r < 0.66) {
    const free = pick(L); L.filter(l => l !== free).forEach(l => addObs('full', l, z));
    if (Math.random() < hard * 0.6) addObs(pick(['low','high']), free, z); else addCoins(free, z - 1, 4);
  } else if (r < 0.82) { L.forEach(l => addObs('low', l, z)); addArc(pick(L), z); }
  else if (r < 0.94) { L.forEach(l => addObs('high', l, z)); }
  else { const t = ['low','high','full'].sort(() => Math.random() - 0.5); L.forEach((l, i) => addObs(t[i], l, z)); }
}
function startRun() {
  if (!glOK) return;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  newRun();
  let z = 46; for (; z < ZFAR; z += gap()) spawnRow(z);
  g.spawnAt = z - ZFAR;
  overShown = false; state = 'play';
  $('menu').hidden = true; $('over').hidden = true; $('pause').hidden = true; $('hud').hidden = false;
  try { localStorage.setItem('jjrun.char', sel); } catch (e) {}
  beep(520, 0.12, 'square', 0.05, 300);
}
function toMenu() {
  state = 'menu'; newRun();
  $('menu').hidden = false; $('over').hidden = true; $('pause').hidden = true; $('hud').hidden = true;
  $('btnStart').focus({ preventScroll: true });
}
function setPause(on) {
  if (on && state === 'play') { state = 'pause'; $('pause').hidden = false; $('btnResume').focus({ preventScroll: true }); }
  else if (!on && state === 'pause') { state = 'play'; $('pause').hidden = true; last = performance.now(); }
}
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); }

/* ---------- 조작 ---------- */
function act(a) {
  if (state !== 'play') return;
  if (a === 'left' && g.lane > -1) { g.lane--; beep(300, 0.05, 'triangle', 0.03); }
  else if (a === 'right' && g.lane < 1) { g.lane++; beep(300, 0.05, 'triangle', 0.03); }

  for (let i = 0; i < 3; i++) { const c = buildChunk(11 + i * 17); chunks.push(c); scene.add(c); }

  // 장애물 재료
  const stripe = ctex(128, 64, (c, w, h) => { c.fillStyle = '#ff6f59'; c.fillRect(0, 0, w, h); c.fillStyle = '#fff5e4'; for (let i = -2; i < 6; i++) { c.beginPath(); c.moveTo(i * 32, h); c.lineTo(i * 32 + 16, h); c.lineTo(i * 32 + 48, 0); c.lineTo(i * 32 + 32, 0); c.fill(); } });
  const chev = ctex(128, 64, (c, w, h) => { c.fillStyle = '#ffd23f'; c.fillRect(0, 0, w, h); c.fillStyle = '#1a1740'; for (const x of [24, 64, 104]) { c.beginPath(); c.moveTo(x - 14, 18); c.lineTo(x + 14, 18); c.lineTo(x, 46); c.fill(); } });
  const crate = ctex(64, 64, (c, w, h) => { c.fillStyle = '#fff'; c.fillRect(0, 0, w, h); c.fillStyle = 'rgba(0,0,0,.22)'; for (let x = 10; x < w; x += 12) c.fillRect(x, 6, 3, h - 12); c.fillRect(0, 0, w, 4); c.fillRect(0, h - 4, w, 4); });
  MAT.stripe = new THREE.MeshLambertMaterial({ map: stripe }); MAT.chev = new THREE.MeshLambertMaterial({ map: chev });
  MAT.dark = new THREE.MeshLambertMaterial({ color: '#2a2755' });
  MAT.crate = ['#9a78e6', '#35b5ad', '#ee78a8'].map(c => new THREE.MeshLambertMaterial({ color: c, map: crate }));
  MAT.coin = new THREE.MeshLambertMaterial({ color: '#ffd23f', emissive: '#9a6a00' });
  GEO.coin = new THREE.CylinderGeometry(0.27, 0.27, 0.07, 18); GEO.coin.rotateX(Math.PI / 2);
  objGroup = new THREE.Group(); scene.add(objGroup);

  // 캐릭터
  for (const id of ORDER) { players[id] = buildPlayer(id); scene.add(players[id]); }
  shadow = new THREE.Mesh(new THREE.CircleGeometry(0.6, 24), new THREE.MeshBasicMaterial({ color: 0x1a1740, transparent: true, opacity: 0.3, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.03; shadow.renderOrder = 5; scene.add(shadow);
  shield = new THREE.Mesh(new THREE.SphereGeometry(1.15, 20, 14), new THREE.MeshBasicMaterial({ color: 0x7df9ff, transparent: true, opacity: 0.22, depthWrite: false, fog: false }));
  shield.renderOrder = 12; scene.add(shield);
}
function makeObj(o) {
  let m;
  if (o.k === 'coin') m = new THREE.Mesh(GEO.coin, MAT.coin);
  else if (o.k === 'full') { m = new THREE.Mesh(GEO.box, MAT.crate[o.c]); m.scale.set(1.34, 2.4, 1.6); }
  else {
    m = new THREE.Group();
    const add = (mat, sx, sy, sz, x, y) => { const b = new THREE.Mesh(GEO.box, mat); b.scale.set(sx, sy, sz); b.position.set(x, y, 0); m.add(b); };
    if (o.k === 'low') { add(MAT.stripe, 1.34, 0.5, 0.16, 0, 0.57); add(MAT.dark, 0.1, 0.4, 0.1, -0.5, 0.2); add(MAT.dark, 0.1, 0.4, 0.1, 0.5, 0.2); }
    else { add(MAT.chev, 1.44, 0.72, 0.2, 0, 1.46); add(MAT.dark, 0.12, 2.3, 0.12, -0.68, 1.15); add(MAT.dark, 0.12, 2.3, 0.12, 0.68, 1.15); }
  }
  objGroup.add(m); return m;
}
function resize() {
  const r = stage.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height);
  if (!glOK) return;
  R.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); R.setSize(W, H, false);
  cam.aspect = W / H; cam.fov = 2 * Math.atan(Math.max(Math.tan(Math.PI / 6), 0.42 / cam.aspect)) * 180 / Math.PI; cam.updateProjectionMatrix();
}
function render() {
  if (!glOK) return;
  frameId++;
  pathTex.offset.y = (g.scroll / TILE) % 1;
  chunks.forEach((c, i) => { c.position.z = ((g.scroll + i * CH) % (3 * CH)) - CH; });
  for (const o of g.objs) {
    const m = o.m || (o.m = makeObj(o)); m.userData.f = frameId;
    if (o.k === 'coin') { m.position.set(o.x, o.y, ZP - o.z); m.rotation.y = T * 4 + o.ph; }
    else if (o.k === 'full') m.position.set(o.x, 1.2, ZP - o.z - 0.8);
    else m.position.set(o.x, 0, ZP - o.z);
  }
  for (let i = objGroup.children.length - 1; i >= 0; i--) if (objGroup.children[i].userData.f !== frameId) objGroup.remove(objGroup.children[i]);

  const dead = state === 'over', air = g.y > 0.05, slide = g.slide > 0 && !dead, run = !air && !slide && !dead, s = Math.sin(g.phase);
  for (const id of ORDER) players[id].visible = false;
  const p = players[sel], u = p.userData;
  p.visible = !(g.inv > 0 && Math.floor(T * 14) % 2);
  p.position.set(g.x, g.y, 0);
  p.rotation.set(dead ? -Math.min(1, g.dead * 3) * 1.45 : run ? -0.1 : air ? -0.05 : 0, run ? s * 0.12 : 0, dead ? 0 : -(g.lane * LANE - g.x) * 0.16);
  if (slide) p.scale.set(1.12, 0.5, 1.12); else p.scale.set(1, 1, 1);
  u.body.position.y = run ? Math.abs(Math.cos(g.phase)) * 0.07 : 0; u.body.rotation.z = run ? s * 0.05 : 0;
  u.legL.rotation.x = run ? s * u.amp : air ? 0.8 : 0; u.legR.rotation.x = run ? -s * u.amp : air ? -0.5 : 0;
  if (u.armL) {
    const v = run ? s * 0.7 : 0;
    if (u.yaw) { u.armL.rotation.y = v * 0.7; u.armR.rotation.y = v * 0.7; u.armL.rotation.z = air ? -0.5 : 0; u.armR.rotation.z = air ? 0.5 : 0; }
    else { u.armL.rotation.x = -v; u.armR.rotation.x = v; u.armL.rotation.z = air ? -1.9 : -0.98; u.armR.rotation.z = air ? 1.9 : 0.98; }
  }
  const sh = clamp(1 - g.y / 4, 0.4, 1); shadow.position.x = g.x; shadow.scale.set(sh, sh, 1);
  shield.visible = g.shield > 0 && !dead; shield.position.set(g.x, g.y + 0.92, 0); shield.material.opacity = 0.2 + 0.08 * Math.sin(T * 6);

  const k = g.shake > 0 && !reduceMotion ? g.shake * 0.8 : 0, cx = g.x * 0.5;
  cam.position.set(cx + (Math.random() - 0.5) * k, 4.0 + g.y * 0.22 + (Math.random() - 0.5) * k, 6.7);
  cam.lookAt(cx * 0.85, 1.3 + g.y * 0.15, -9);
  R.render(scene, cam);
}

/* ---------- 선택 화면 그림 ---------- */
const FRONT = {};
for (const id of ORDER) { const im = new Image(); im.onload = paintCards; im.src = SP.f[id]; FRONT[id] = im; }
function paintCards() {
  for (const id of ORDER) {
    const b = $('char-' + id), im = FRONT[id]; if (!b || !im.complete || !im.naturalWidth) continue;
    const cc = b.querySelector('canvas'), x = cc.getContext('2d'), h = cc.height - 16, w = h * im.naturalWidth / im.naturalHeight;
    x.clearRect(0, 0, cc.width, cc.height); x.drawImage(im, (cc.width - w) / 2, 8, w, h);
  }
}

/* ---------- HUD / 화면 ---------- */
const hud = { d: '', c: '', chip: '' };
function syncHud() {
  const d = String(Math.floor(g.dist)), c = String(g.coins);
  const chip = sel === 'jj' ? '자석 ON' : sel === 'byeol' ? '2단 점프' : g.shield ? '방패 1회 남음' : '방패 다 씀';
  if (d !== hud.d) $('hDist').textContent = hud.d = d;
  if (c !== hud.c) $('hCoin').textContent = hud.c = c;
  if (chip !== hud.chip) $('chip').textContent = hud.chip = chip;
}
function showOver() {
  overShown = true;
  const dist = Math.floor(g.dist), score = dist + g.coins * 10, isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('jjrun.best', String(best)); } catch (e) {} }
  $('oTitle').textContent = isBest && score > 0 ? '신기록 떴다!' : '앗, 부딪혔다!';
  $('oScore').textContent = score.toLocaleString('ko-KR');
  $('oDist').textContent = dist.toLocaleString('ko-KR') + ' m';
  $('oCoin').textContent = g.coins + ' × 10';
  $('oBest').textContent = best.toLocaleString('ko-KR');
  $('oQuip').textContent = score < 300 ? '방금 건 몸풀기였죠? 진짜는 지금부터.' : score < 1000 ? '오, 폼 올라오는 중. 한 판만 더?' :
    score < 2500 ? '이 정도면 육상부에서 연락 올 각.' : '이건 좀 치는데요? ' + CHARS[sel].name + '도 놀랐어요.';
  $('hud').hidden = true; $('over').hidden = false; $('btnRetry').focus({ preventScroll: true });
  submitScore();
}

/* ---------- 랭킹 ---------- */
const RANK_URL = String(window.JJ_RANK_URL || '').trim().replace(/\/+$/, '');
let uid = '';
try { uid = localStorage.getItem('jjrun.uid') || ''; $('nick').value = localStorage.getItem('jjrun.nick') || ''; } catch (e) {}
if (!/^p[a-z0-9]{8,30}$/.test(uid)) { uid = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); try { localStorage.setItem('jjrun.uid', uid); } catch (e) {} }
const nick = () => $('nick').value.trim().slice(0, 10);
$('nick').addEventListener('input', () => { try { localStorage.setItem('jjrun.nick', nick()); } catch (e) {} });
if (!RANK_URL) { $('nickRow').hidden = true; $('btnRank').hidden = true; $('btnRank2').hidden = true; }
async function fetchRank() {
  const r = await fetch(RANK_URL + '/scores.json?orderBy=%22score%22&limitToLast=50', { cache: 'no-store' });
  if (!r.ok) throw new Error('rank ' + r.status);
  const o = (await r.json()) || {};
  return Object.keys(o).map(k => ({ id: k, name: String(o[k].name || '').slice(0, 10), score: +o[k].score, char: o[k].char }))
    .filter(v => v.score >= 0).sort((a, b) => b.score - a.score);
}
async function submitScore() {
  const el = $('oRank'); if (!RANK_URL) { el.hidden = true; return; }
  el.hidden = false;
  if (!nick()) { el.textContent = '닉네임을 적으면 랭킹에 올라가요. 캐릭터 바꾸기 화면에서 입력할 수 있어요.'; return; }
  el.textContent = '랭킹에 올리는 중…';
  try {
    if (best > 0) await fetch(RANK_URL + '/scores/' + uid + '.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: nick(), score: best, char: sel, t: Date.now() }) });
    const list = await fetchRank(), i = list.findIndex(v => v.id === uid);
    el.textContent = i >= 0 ? '지금 내 순위는 ' + (i + 1) + '위예요. (최고 ' + list[i].score.toLocaleString('ko-KR') + '점)' : '아직 50위 안에 못 들었어요. 한 판 더!';
  } catch (e) { el.textContent = '랭킹 서버에 연결하지 못했어요. 점수는 이 기기에만 저장됐어요.'; }
}
async function openRank() {
  const ol = $('rankList'), msg = $('rankMsg'); ol.textContent = ''; msg.textContent = '불러오는 중…'; $('rank').hidden = false; $('btnRankClose').focus({ preventScroll: true });
  try {
    const list = await fetchRank(); msg.textContent = list.length ? '' : '아직 기록이 없어요. 1등 자리가 비어 있어요!';
    list.slice(0, 10).forEach((v, i) => {
      const li = document.createElement('li'), a = document.createElement('span'), b = document.createElement('span'), c = document.createElement('span'), d = document.createElement('small');
      a.className = 'no'; a.textContent = i + 1; b.className = 'nm'; b.textContent = v.name || '이름없음'; d.textContent = CHARS[v.char] ? CHARS[v.char].name : '';
      b.append(d); c.className = 'sc'; c.textContent = v.score.toLocaleString('ko-KR'); if (v.id === uid) li.className = 'me'; li.append(a, b, c); ol.append(li);
    });
    const mine = list.findIndex(v => v.id === uid); if (mine >= 10) msg.textContent = '내 순위: ' + (mine + 1) + '위';
  } catch (e) { msg.textContent = '랭킹을 불러오지 못했어요. 잠시 뒤에 다시 눌러 주세요.'; }
}
function closeRank() { $('rank').hidden = true; }
$('btnRank').onclick = openRank; $('btnRank2').onclick = openRank; $('btnRankClose').onclick = closeRank;
function choose(id) {
  sel = id;
  for (const b of $('chars').children) b.setAttribute('aria-pressed', String(b.dataset.id === id));
  $('desc').textContent = CHARS[id].name + ' · ' + CHARS[id].desc;
}
function buildMenu() {
  for (const id of ORDER) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'char'; b.dataset.id = id; b.id = 'char-' + id;
    const c = document.createElement('canvas'); c.width = 190; c.height = 192;
    const n = document.createElement('b'); n.textContent = CHARS[id].name;
    const t = document.createElement('i'); t.textContent = CHARS[id].tag;
    b.append(c, n, t); b.onclick = () => choose(id); $('chars').append(b);
  }
  choose(sel); paintCards();
}
function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000 || 0)); last = now; T += dt;
  if (state === 'play') { update(dt); syncHud(); }
  else if (state === 'menu') { g.scroll += 7 * dt; g.phase += dt * 9; }
  else if (state === 'over') { g.dead += dt; if (g.shake > 0) g.shake -= dt; if (!overShown && g.dead > 0.7) showOver(); }
  render();
  requestAnimationFrame(frame);
}

newRun(); buildMenu();
try { if (!window.THREE) throw 0; init3D(); } catch (e) {
  glOK = false; $('desc').textContent = '이 브라우저에서는 3D 화면을 켤 수 없어요. 다른 브라우저로 열어 주세요.'; $('btnStart').disabled = true;
}
resize();
requestAnimationFrame(frame);
})();
</script>
